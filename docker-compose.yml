services:
  meter:
    build: .
    image: nahovnost-metr:latest
    container_name: nahovnost-metr
    ports:
      - "${PORT:-8080}:8000"
    environment:
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      METERS_CONFIG: "${METERS_CONFIG:-/data/meters.json}"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
