services:
  meter:
    build: .
    image: nahovnost-metr:latest
    container_name: nahovnost-metr
    ports:
      - "${PORT:-8080}:8000"
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN in .env (see .env.example)}"
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
